<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dave's GitHub Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: #fff;
            text-align: center;
            padding-top: 10%;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: #4e73df;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #1cc88a;
        }
        #message {
            margin-top: 20px;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <h1>Dave’s GitHub Home</h1>
    <p>Explore my projects — or click the button for a surprise.</p>

    <button onclick="showMessage()">Give me something fun</button>
    <div id="message"></div>

    <script>
        const messages = [
            "Keep coding — future you will thank you.",
            "GitHub Pages is easier than you think.",
            "Small projects lead to big ideas.",
            "INST630 students are awesome."
        ];

        function showMessage() {
            const msg = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('message').innerText = msg;
        }
    </script>
</body>
</html>
